<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Ideas Archive — CryptoSI DAO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Poppins:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* ── Exact cryptosidao.org dark theme tokens ── */
    --background: 240 5.9% 10%;
    --foreground: 0 0% 98%;
    --card: 240 5.9% 10%;
    --card-foreground: 0 0% 98%;
    --primary: 222 96% 61%;
    --primary-foreground: 0 0% 98%;
    --secondary: 240 3.7% 15.9%;
    --secondary-foreground: 0 0% 98%;
    --muted: 240 3.7% 15.9%;
    --muted-foreground: 240 5% 64.9%;
    --accent-hsl: 240 33% 55%;
    --accent-foreground: 0 0% 98%;
    --destructive: 0 62.8% 30.6%;
    --border: 240 3.7% 15.9%;
    --input: 240 3.7% 15.9%;
    --ring: 222 96% 61%;
    --radius: 0.5rem;

    /* ── Resolved hex values ── */
    --bg-primary: #13131f;
    --bg-secondary: #1a1a2e;
    --bg-card: #1e1e32;
    --bg-card-hover: #25253e;
    --bg-elevated: #1a1a2e;
    --text-primary: #fafafa;
    --text-secondary: #a0a0b8;
    --text-muted: #6b6b8d;
    --accent: #4a7cf7;
    --accent-hover: #5e8df8;
    --accent-glow: rgba(74, 124, 247, 0.12);
    --accent-glow-strong: rgba(74, 124, 247, 0.25);
    --border-color: #2a2a40;
    --border-light: #3a3a55;
    --green: #34d399;
    --yellow: #fbbf24;
    --red: #f87171;
    --orange: #fb923c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Poppins', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }

  /* ── Header ── */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: hsl(var(--background) / 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid hsl(var(--border) / 0.4);
  }

  .header-inner {
    max-width: 1400px;
    margin: 0 auto;
    padding: 0 2rem;
    height: 4rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    text-decoration: none;
    color: var(--text-primary);
  }

  .logo-icon {
    width: 28px;
    height: 28px;
    color: hsl(var(--primary));
    font-size: 1.25rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .logo-text {
    font-family: 'Anton', sans-serif;
    font-size: 1.25rem;
    font-weight: 400;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-primary);
  }

  .header-stats {
    display: flex;
    gap: 1.5rem;
    font-size: 0.8125rem;
    color: var(--text-muted);
    font-family: 'Poppins', sans-serif;
  }

  .header-stats strong {
    color: var(--text-primary);
    font-weight: 600;
  }

  /* ── Main ── */
  .container {
    max-width: 1400px;
    margin: 0 auto;
    padding: 2rem;
  }

  /* ── Date Navigation ── */
  .date-nav {
    display: flex;
    gap: 0.5rem;
    overflow-x: auto;
    padding-bottom: 0.5rem;
    margin-bottom: 2rem;
    scrollbar-width: none;
  }
  .date-nav::-webkit-scrollbar { display: none; }

  .date-chip {
    flex-shrink: 0;
    padding: 0.625rem 1.25rem;
    border-radius: 100px;
    border: 1px solid hsl(var(--border) / 0.5);
    background: transparent;
    color: var(--text-muted);
    font-size: 0.8125rem;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
    font-family: 'JetBrains Mono', monospace;
  }

  .date-chip:hover {
    border-color: hsl(var(--primary) / 0.6);
    color: var(--text-primary);
  }

  .date-chip.active {
    background: hsl(var(--primary));
    border-color: hsl(var(--primary));
    color: hsl(var(--primary-foreground));
    font-weight: 600;
  }

  /* ── Day Header ── */
  .day-header {
    margin-bottom: 1.5rem;
  }

  .day-header h1 {
    font-family: 'Anton', sans-serif;
    font-size: 2.5rem;
    font-weight: 400;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-primary);
    margin-bottom: 0.25rem;
  }

  .day-header .date-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }

  /* ── Summary ── */
  .summary-section {
    border: 1px solid hsl(var(--border) / 0.5);
    border-radius: var(--radius);
    padding: 1.75rem;
    margin-bottom: 2rem;
    background: hsl(var(--card));
  }

  .summary-section h3 {
    font-family: 'Anton', sans-serif;
    font-size: 1rem;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: hsl(var(--primary));
    margin-bottom: 1.25rem;
  }

  .summary-content {
    font-size: 0.9375rem;
    color: var(--text-secondary);
    line-height: 1.8;
  }

  .summary-content h1, .summary-content h2,
  .summary-content h3, .summary-content h4 {
    color: var(--text-primary);
    margin: 1.5rem 0 0.75rem;
    font-weight: 700;
  }
  .summary-content h1 { font-size: 1.375rem; }
  .summary-content h2 { font-size: 1.125rem; font-family: 'Anton', sans-serif; font-weight: 400; text-transform: uppercase; letter-spacing: 0.04em; }
  .summary-content h3 { font-size: 0.875rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); font-family: 'Poppins', sans-serif; }
  .summary-content p { margin-bottom: 0.875rem; }
  .summary-content ul, .summary-content ol { padding-left: 1.5rem; margin-bottom: 0.875rem; }
  .summary-content li { margin-bottom: 0.375rem; }
  .summary-content strong { color: var(--text-primary); font-weight: 600; }
  .summary-content em { color: var(--text-muted); }
  .summary-content a { color: hsl(var(--primary)); text-decoration: none; }
  .summary-content a:hover { text-decoration: underline; }
  .summary-content hr { border: none; border-top: 1px solid hsl(var(--border) / 0.5); margin: 1.5rem 0; }
  .summary-content blockquote {
    border-left: 3px solid hsl(var(--primary));
    padding-left: 1rem;
    margin: 1rem 0;
    color: var(--text-muted);
    font-style: italic;
  }
  .summary-content code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8125rem;
    background: hsl(var(--muted));
    padding: 0.125rem 0.375rem;
    border-radius: 0.25rem;
    color: hsl(var(--primary));
  }
  .summary-content pre {
    background: hsl(var(--muted));
    border: 1px solid hsl(var(--border) / 0.5);
    border-radius: var(--radius);
    padding: 1rem;
    overflow-x: auto;
    margin: 1rem 0;
  }
  .summary-content pre code { background: none; padding: 0; }
  .summary-content table {
    width: 100%;
    border-collapse: collapse;
    margin: 1rem 0;
    font-size: 0.875rem;
  }
  .summary-content th {
    text-align: left;
    padding: 0.625rem 0.75rem;
    border-bottom: 2px solid hsl(var(--border));
    color: var(--text-primary);
    font-weight: 600;
    font-size: 0.6875rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .summary-content td {
    padding: 0.625rem 0.75rem;
    border-bottom: 1px solid hsl(var(--border) / 0.4);
    color: var(--text-secondary);
  }
  .summary-content tr:hover td { background: hsl(var(--muted) / 0.3); }

  /* ── Ideas Grid ── */
  .ideas-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 1.25rem;
    margin-bottom: 3rem;
  }

  .idea-card {
    background: hsl(var(--card));
    border: 1px solid hsl(var(--border) / 0.5);
    border-radius: var(--radius);
    padding: 1.5rem;
    cursor: pointer;
    transition: all 0.2s ease;
    position: relative;
    overflow: hidden;
  }

  .idea-card:hover {
    border-color: hsl(var(--primary) / 0.5);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    transform: translateY(-2px);
  }

  .idea-rank {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.75rem;
    height: 1.75rem;
    border-radius: 0.375rem;
    font-size: 0.8125rem;
    font-weight: 700;
    margin-bottom: 1rem;
    font-family: 'JetBrains Mono', monospace;
  }

  .rank-1 { background: rgba(251, 191, 36, 0.15); color: var(--yellow); }
  .rank-2 { background: rgba(192, 192, 208, 0.15); color: #c0c0d0; }
  .rank-3 { background: rgba(251, 146, 60, 0.15); color: var(--orange); }

  .idea-card h3 {
    font-family: 'Anton', sans-serif;
    font-size: 1.125rem;
    font-weight: 400;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    margin-bottom: 0.5rem;
    line-height: 1.3;
    color: var(--text-primary);
  }

  .idea-card .pitch {
    font-size: 0.875rem;
    color: var(--text-secondary);
    line-height: 1.6;
    margin-bottom: 1.25rem;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .idea-scores {
    display: flex;
    gap: 0.5rem;
    flex-wrap: wrap;
  }

  .score-pill {
    font-size: 0.6875rem;
    font-weight: 600;
    padding: 0.25rem 0.75rem;
    border-radius: 100px;
    background: hsl(var(--muted));
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
  }

  .score-pill.highlight {
    background: hsl(var(--primary) / 0.15);
    color: hsl(var(--primary));
  }

  /* ── Modal ── */
  .modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0, 0.6);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 200;
    align-items: flex-start;
    justify-content: center;
    padding: 2.5rem 1rem;
    overflow-y: auto;
  }

  .modal-overlay.open { display: flex; }

  .modal {
    background: hsl(var(--background));
    border: 1px solid hsl(var(--border) / 0.5);
    border-radius: var(--radius);
    width: 100%;
    max-width: 800px;
    max-height: calc(100vh - 5rem);
    overflow-y: auto;
    position: relative;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    margin: auto;
  }

  .modal-header {
    position: sticky;
    top: 0;
    background: hsl(var(--background) / 0.95);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 1.5rem 2rem;
    border-bottom: 1px solid hsl(var(--border) / 0.4);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
    z-index: 10;
  }

  .modal-header h2 {
    font-family: 'Anton', sans-serif;
    font-size: 1.375rem;
    font-weight: 400;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-primary);
    line-height: 1.2;
  }

  .modal-header .subtitle {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    color: var(--text-muted);
    margin-top: 0.25rem;
  }

  .modal-close {
    flex-shrink: 0;
    width: 2.25rem;
    height: 2.25rem;
    border-radius: var(--radius);
    border: 1px solid hsl(var(--border) / 0.5);
    background: hsl(var(--card));
    color: var(--text-secondary);
    font-size: 1.25rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
  }

  .modal-close:hover {
    background: hsl(var(--muted));
    color: var(--text-primary);
  }

  /* ── Modal Tabs ── */
  .modal-tabs {
    display: flex;
    gap: 0;
    padding: 0 2rem;
    border-bottom: 1px solid hsl(var(--border) / 0.3);
    background: hsl(var(--background));
    position: sticky;
    top: 5.25rem;
    z-index: 9;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .modal-tabs::-webkit-scrollbar { display: none; }

  .modal-tab {
    padding: 0.75rem 1.25rem;
    font-size: 0.8125rem;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s ease;
    white-space: nowrap;
  }

  .modal-tab:hover { color: var(--text-secondary); }
  .modal-tab.active {
    color: hsl(var(--primary));
    border-bottom-color: hsl(var(--primary));
  }

  .modal-body { padding: 2rem; }

  .md-content {
    font-size: 0.9375rem;
    line-height: 1.8;
    color: var(--text-secondary);
    font-family: 'Poppins', sans-serif;
  }

  .md-content h1 {
    font-family: 'Anton', sans-serif;
    font-size: 1.5rem;
    font-weight: 400;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-primary);
    margin: 2rem 0 1rem;
    padding-bottom: 0.75rem;
    border-bottom: 1px solid hsl(var(--border) / 0.5);
  }
  .md-content h1:first-child { margin-top: 0; }

  .md-content h2 {
    font-family: 'Anton', sans-serif;
    font-size: 1.125rem;
    font-weight: 400;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: var(--text-primary);
    margin: 1.75rem 0 0.875rem;
  }

  .md-content h3 {
    font-size: 0.8125rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-secondary);
    margin: 1.25rem 0 0.5rem;
  }

  .md-content p { margin-bottom: 0.875rem; }
  .md-content ul, .md-content ol { padding-left: 1.5rem; margin-bottom: 0.875rem; }
  .md-content li { margin-bottom: 0.375rem; }
  .md-content strong { color: var(--text-primary); font-weight: 600; }
  .md-content em { color: var(--text-muted); }
  .md-content a { color: hsl(var(--primary)); text-decoration: none; }
  .md-content a:hover { text-decoration: underline; }
  .md-content hr { border: none; border-top: 1px solid hsl(var(--border) / 0.5); margin: 1.5rem 0; }
  .md-content blockquote {
    border-left: 3px solid hsl(var(--primary));
    padding-left: 1rem;
    margin: 1rem 0;
    color: var(--text-muted);
    font-style: italic;
  }
  .md-content code {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.8125rem;
    background: hsl(var(--muted));
    padding: 0.125rem 0.375rem;
    border-radius: 0.25rem;
    color: hsl(var(--primary));
  }
  .md-content pre {
    background: hsl(var(--muted));
    border: 1px solid hsl(var(--border) / 0.5);
    border-radius: var(--radius);
    padding: 1rem;
    overflow-x: auto;
    margin: 1rem 0;
  }
  .md-content pre code { background: none; padding: 0; }
  .md-content table {
    width: 100%;
    border-collapse: collapse;
    margin: 1rem 0;
    font-size: 0.875rem;
  }
  .md-content th {
    text-align: left;
    padding: 0.625rem 0.75rem;
    border-bottom: 2px solid hsl(var(--border));
    color: var(--text-primary);
    font-weight: 600;
    font-size: 0.6875rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .md-content td {
    padding: 0.625rem 0.75rem;
    border-bottom: 1px solid hsl(var(--border) / 0.4);
  }
  .md-content tr:hover td { background: hsl(var(--muted) / 0.3); }

  /* ── Loading ── */
  .loading {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 5rem 1.5rem;
    gap: 1rem;
  }

  .spinner {
    width: 2.5rem;
    height: 2.5rem;
    border: 3px solid hsl(var(--border));
    border-top-color: hsl(var(--primary));
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .loading p { color: var(--text-muted); font-size: 0.875rem; }

  /* ── Empty State ── */
  .empty-state { text-align: center; padding: 3.75rem 1.5rem; color: var(--text-muted); }
  .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; }
  .empty-state h3 { color: var(--text-secondary); margin-bottom: 0.5rem; }

  /* ── Footer ── */
  footer {
    text-align: center;
    padding: 2.5rem 1.5rem;
    color: var(--text-muted);
    font-size: 0.8125rem;
    border-top: 1px solid hsl(var(--border) / 0.3);
    margin-top: 2.5rem;
    background: hsl(var(--card));
  }

  footer a {
    color: hsl(var(--primary));
    text-decoration: none;
  }
  footer a:hover { text-decoration: underline; }

  /* ── Responsive ── */
  @media (max-width: 768px) {
    .header-inner { padding: 0 1rem; height: 3.5rem; }
    .logo-text { font-size: 1rem; }
    .header-stats { display: none; }
    .container { padding: 1.25rem 1rem; }
    .ideas-grid { grid-template-columns: 1fr; gap: 1rem; }
    .idea-card { padding: 1.25rem; }
    .summary-section { padding: 1.25rem; }
    .modal-header { padding: 1.25rem 1.5rem; }
    .modal-body { padding: 1.5rem; }
    .modal-tabs { padding: 0 1.5rem; }
    .day-header h1 { font-size: 1.75rem; }
    .date-chip { padding: 0.5rem 1rem; font-size: 0.75rem; }
  }

  @media (max-width: 480px) {
    .container { padding: 1rem 0.75rem; }
    .modal { border-radius: var(--radius); }
    .day-header h1 { font-size: 1.375rem; }
  }

  /* ── Leaderboard Navigation ── */
  ._lb-nav {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 2rem;
    border-bottom: 1px solid hsl(var(--border) / 0.4);
    padding-bottom: 0;
  }
  .lb-nav-btn {
    padding: 0.625rem 1.25rem;
    font-size: 0.8125rem;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-muted);
    background: transparent;
    border: none;
    border-bottom: 2px solid transparent;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
    margin-bottom: -1px;
  }
  .lb-nav-btn:hover { color: var(--text-secondary); }
  .lb-nav-btn.active {
    color: hsl(var(--primary));
    border-bottom-color: hsl(var(--primary));
  }

  /* ── Leaderboard Page ── */
  .lb-header {
    margin-bottom: 2rem;
  }
  .lb-header h1 {
    font-family: 'Anton', sans-serif;
    font-size: 2.5rem;
    font-weight: 400;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-primary);
    margin-bottom: 0.5rem;
  }
  .lb-header .lb-subtitle {
    font-size: 0.875rem;
    color: var(--text-muted);
    font-family: 'Poppins', sans-serif;
  }

  /* ── Leaderboard Table ── */
  .lb-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 2rem;
  }
  .lb-table thead th {
    text-align: left;
    padding: 0.75rem 1rem;
    font-size: 0.6875rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--text-muted);
    border-bottom: 2px solid hsl(var(--border));
    font-family: 'Poppins', sans-serif;
    white-space: nowrap;
  }
  .lb-table thead th.right { text-align: right; }
  .lb-table tbody tr {
    transition: background 0.15s ease;
    cursor: pointer;
  }
  .lb-table tbody tr:hover {
    background: hsl(var(--muted) / 0.25);
  }
  .lb-table tbody td {
    padding: 0.875rem 1rem;
    border-bottom: 1px solid hsl(var(--border) / 0.3);
    font-size: 0.875rem;
    color: var(--text-secondary);
    vertical-align: middle;
  }
  .lb-table tbody td.right { text-align: right; }

  .lb-rank {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 1.75rem;
    height: 1.75rem;
    border-radius: 0.375rem;
    font-size: 0.8125rem;
    font-weight: 700;
    font-family: 'JetBrains Mono', monospace;
  }
  .lb-rank.r1 { background: rgba(251, 191, 36, 0.15); color: var(--yellow); }
  .lb-rank.r2 { background: rgba(192, 192, 208, 0.15); color: #c0c0d0; }
  .lb-rank.r3 { background: rgba(251, 146, 60, 0.15); color: var(--orange); }
  .lb-rank.rn { background: hsl(var(--muted) / 0.5); color: var(--text-muted); }

  .lb-idea-name {
    font-family: 'Anton', sans-serif;
    font-size: 0.9375rem;
    font-weight: 400;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--text-primary);
  }
  .lb-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.6875rem;
    color: var(--text-muted);
  }
  .lb-score {
    font-family: 'JetBrains Mono', monospace;
    font-size: 1rem;
    font-weight: 700;
    color: hsl(var(--primary));
  }
  .lb-score-bar-wrap {
    display: flex;
    align-items: center;
    gap: 0.625rem;
  }
  .lb-score-bar {
    flex: 1;
    height: 6px;
    background: hsl(var(--muted) / 0.5);
    border-radius: 3px;
    overflow: hidden;
    min-width: 60px;
  }
  .lb-score-bar-fill {
    height: 100%;
    border-radius: 3px;
    background: hsl(var(--primary));
    transition: width 0.3s ease;
  }
  .lb-dim-pills {
    display: flex;
    gap: 0.375rem;
    flex-wrap: wrap;
  }
  .lb-dim-pill {
    font-size: 0.625rem;
    font-weight: 600;
    padding: 0.1875rem 0.5rem;
    border-radius: 100px;
    background: hsl(var(--muted) / 0.6);
    color: var(--text-muted);
    font-family: 'JetBrains Mono', monospace;
    white-space: nowrap;
  }
  .lb-dim-pill.top {
    background: hsl(var(--primary) / 0.12);
    color: hsl(var(--primary));
  }

  /* ── Sort Controls ── */
  .lb-sort {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    margin-bottom: 1.25rem;
    flex-wrap: wrap;
  }
  .lb-sort-label {
    font-size: 0.75rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-muted);
    margin-right: 0.25rem;
  }
  .lb-sort-btn {
    padding: 0.375rem 0.875rem;
    font-size: 0.6875rem;
    font-weight: 600;
    font-family: 'JetBrains Mono', monospace;
    color: var(--text-muted);
    background: hsl(var(--muted) / 0.4);
    border: 1px solid transparent;
    border-radius: 100px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .lb-sort-btn:hover {
    color: var(--text-secondary);
    background: hsl(var(--muted) / 0.7);
  }
  .lb-sort-btn.active {
    color: hsl(var(--primary));
    background: hsl(var(--primary) / 0.12);
    border-color: hsl(var(--primary) / 0.3);
  }

  /* ── Section hidden by default ── */
  .view-section { display: none; }
  .view-section.active { display: block; }

  @media (max-width: 768px) {
    .lb-header h1 { font-size: 1.75rem; }
    .lb-dim-pills { display: none; }
    .lb-table .hide-mobile { display: none; }
    .lb-nav-btn { padding: 0.5rem 1rem; font-size: 0.75rem; }
  }

</style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="#" class="logo" onclick="return false;">
      <div class="logo-icon">💡</div>
      <div class="logo-text">App Ideas Archive</div>
    </a>
    <div class="header-stats" id="headerStats">
      <span>Loading...</span>
    </div>
  </div>
</header>

<div class="lb-site-nav">
  <button class="lb-nav-btn active" onclick="switchView('daily')" id="navBtnDaily">📅 Daily Research</button>
  <button class="lb-nav-btn" onclick="switchView('leaderboard')" id="navBtnLeaderboard">🏆 Leaderboard</button>
</div>

<main class="container" id="main">
  <div id="view-daily" class="view-section active">
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading ideas...</p>
    </div>
  </div>
  <div id="view-leaderboard" class="view-section">
    <div class="loading">
      <div class="spinner"></div>
      <p>Loading leaderboard...</p>
    </div>
  </div>
</main>

<footer>
  <p>
    <a href="https://cryptosidao.org" target="_blank" rel="noopener">CryptoSI DAO</a> · 
    Researched by <a href="https://t.me/CryptoSI" target="_blank" rel="noopener">Crypto SI</a> · 
    <a href="https://github.com/CryptoSI-DAO/app-ideas" target="_blank" rel="noopener">GitHub</a>
  </p>
</footer>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-header">
      <div>
        <h2 id="modalTitle">Idea Title</h2>
        <div class="subtitle" id="modalSubtitle"></div>
      </div>
      <button class="modal-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-tabs" id="modalTabs"></div>
    <div class="modal-body">
      <div class="md-content" id="modalContent"></div>
    </div>
  </div>
</div>

<script>
// ── Markdown Parser ──
function parseMD(md) {
  if (!md) return '<p style="color:hsl(var(--muted-foreground))">No content available.</p>';
  let h = md;

  // Fenced code blocks
  h = h.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code>$2</code></pre>');
  // Inline code
  h = h.replace(/`([^`]+)`/g, '<code>$1</code>');

  // Tables
  h = h.replace(/((?:^\|.+\|\n?)+)/gm, (match) => {
    const rows = match.trim().split('\n');
    const sepIdx = rows.findIndex(r => /^\|[\s\-:|]+\|$/.test(r.trim()));
    const hdrRows = sepIdx > 0 ? rows.slice(0, sepIdx) : [rows[0]];
    const bodyRows = sepIdx > 0 ? rows.slice(sepIdx + 1) : rows.slice(1);
    const headers = hdrRows[0].split('|').filter(c => c.trim()).map(c => c.trim());
    let table = '<table><thead><tr>';
    headers.forEach(hd => { table += '<th>' + hd + '</th>'; });
    table += '</tr></thead><tbody>';
    bodyRows.forEach(row => {
      if (!row.trim()) return;
      const cells = row.split('|').filter(c => !/^[\s\-:]+$/.test(c)).map(c => c.trim());
      if (cells.every(c => /^[\s\-:]+$/.test(c))) return;
      table += '<tr>';
      cells.forEach(c => { table += '<td>' + c + '</td>'; });
      table += '</tr>';
    });
    table += '</tbody></table>';
    return table;
  });

  // Headers
  h = h.replace(/^### (.+)$/gm, '<h3>$1</h3>');
  h = h.replace(/^## (.+)$/gm, '<h2>$1</h2>');
  h = h.replace(/^# (.+)$/gm, '<h1>$1</h1>');
  h = h.replace(/^---$/gm, '<hr>');
  h = h.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');
  h = h.replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>');

  // Bold & Italic
  h = h.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
  h = h.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  h = h.replace(/\*(.+?)\*/g, '<em>$1</em>');

  // Links
  h = h.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

  // List items
  h = h.replace(/^- (.+)$/gm, '<li>$1</li>');
  h = h.replace(/^• (.+)$/gm, '<li>$1</li>');

  // Wrap consecutive <li>
  h = h.replace(/((?:<li>.*<\/li>\n?)+)/g, '<ul>$1</ul>');

  // Paragraphs
  h = h.replace(/^(?!<[a-z/])((?!^\s*$).+)$/gm, '<p>$1</p>');

  // Cleanup
  h = h.replace(/<p>\s*<\/p>/g, '');
  h = h.replace(/<p>(<h[1-3]>)/g, '$1');
  h = h.replace(/(<\/h[1-3]>)<\/p>/g, '$1');
  h = h.replace(/<p>(<ul>|<ol>|<pre>|<blockquote>|<hr>|<table>)/g, '$1');
  h = h.replace(/(<\/ul>|<\/ol>|<\/pre>|<\/blockquote>|<\/table>)<\/p>/g, '$1');

  return h;
}

// ── State ──
let data = null;
let currentDate = null;

// ── Init ──
// ── GitHub API config ──
const REPO = "CryptoSI-DAO/app-ideas";
const API_BASE = `https://api.github.com/repos/${REPO}/contents/ideas`;
const RAW_BASE = `https://raw.githubusercontent.com/${REPO}/main/ideas`;

async function ghAPI(url) {
  const r = await fetch(url, { headers: { Accept: "application/vnd.github.v3+json" } });
  if (!r.ok) throw new Error(`GitHub API ${r.status}`);
  return r.json();
}

async function fetchMarkdown(path) {
  const r = await fetch(`${RAW_BASE}/${path}`);
  if (!r.ok) throw new Error(`Fetch ${path}: ${r.status}`);
  return r.text();
}

async function init() {
  try {
    // Try live GitHub API first
    data = await buildFromGitHub();
  } catch (e) {
    console.warn("GitHub API failed, falling back to data.json:", e.message);
    try {
      const resp = await fetch('data.json');
      if (!resp.ok) throw new Error('data.json not found');
      data = await resp.json();
    } catch (e2) {
      document.getElementById('main').innerHTML = `
        <div class="empty-state">
          <div class="icon">⚠️</div>
          <h3>Failed to load ideas</h3>
          <p>${e.message}</p>
        </div>`;
      return;
    }
  }
  renderHeader();
  renderNav();
  const dates = Object.keys(data.dates).sort().reverse();
  if (dates.length) selectDate(dates[0]);
}

async function buildFromGitHub() {
  const dates = await ghAPI(API_BASE);
  const structure = {};

  for (const dir of dates.filter(d => d.type === 'dir')) {
    const dateName = dir.name;
    const contents = await ghAPI(dir.url);
    const entry = { ideas: [], has_summary: false };

    // Daily summary
    const summary = contents.find(f => f.name === 'daily-summary.md');
    if (summary) {
      entry.has_summary = true;
      entry.summaryContent = await fetchMarkdown(`${dateName}/daily-summary.md`);
    }

    // Idea subdirectories
    const ideaDirs = contents.filter(c => c.type === 'dir' && c.name.match(/^\d{3}-/));
    for (const ideaDir of ideaDirs.sort((a, b) => a.name.localeCompare(b.name))) {
      const ideaContents = await ghAPI(ideaDir.url);
      const files = {};
      for (const file of ideaContents.filter(f => f.name.endsWith('.md'))) {
        files[file.name] = await fetchMarkdown(`${dateName}/${ideaDir.name}/${file.name}`);
      }
      if (Object.keys(files).length) {
        entry.ideas.push({ slug: ideaDir.name, files });
      }
    }
    structure[dateName] = entry;
  }

  return {
    generated: new Date().toISOString().slice(0, 10),
    repo: REPO,
    dates: structure
  };
}

function renderHeader() {
  const dates = Object.keys(data.dates);
  let total = 0;
  dates.forEach(d => { total += data.dates[d].ideas.length; });
  document.getElementById('headerStats').innerHTML = `
    <span><strong>${dates.length}</strong> days</span>
    <span><strong>${total}</strong> ideas</span>
    <span style="color:hsl(var(--primary))">🏆 <a href="#" onclick="switchView('leaderboard');return false;" style="color:hsl(var(--primary));text-decoration:none">Leaderboard</a></span>
  `;
}

function renderNav() {
  const dates = Object.keys(data.dates).sort().reverse();
  const nav = document.createElement('div');
  nav.className = 'date-nav';
  dates.forEach(date => {
    const chip = document.createElement('button');
    chip.className = 'date-chip';
    chip.textContent = fmtDate(date);
    chip.dataset.date = date;
    chip.onclick = () => selectDate(date);
    nav.appendChild(chip);
  });
  const dailyView = document.getElementById('view-daily');
  dailyView.innerHTML = '';
  dailyView.appendChild(nav);
  const content = document.createElement('div');
  content.id = 'dayContent';
  dailyView.appendChild(content);
}

function selectDate(date) {
  currentDate = date;
  document.querySelectorAll('.date-chip').forEach(c => {
    c.classList.toggle('active', c.dataset.date === date);
  });
  renderDay(date);
}

function renderDay(date) {
  const d = data.dates[date];
  const el = document.getElementById('dayContent');
  if (!d) { el.innerHTML = '<div class="empty-state"><p>No data.</p></div>'; return; }

  let html = `
    <div class="day-header">
      <div class="date-label">${fmtDate(date)}</div>
      <h1>${d.ideas.length} App Idea${d.ideas.length !== 1 ? 's' : ''}</h1>
    </div>
  `;

  if (d.hasSummary && d.summaryContent) {
    html += `
      <div class="summary-section">
        <h3>📊 Daily Summary</h3>
        <div class="summary-content">${parseMD(d.summaryContent)}</div>
      </div>
    `;
  }

  html += '<div class="ideas-grid">';
  d.ideas.forEach((idea, i) => {
    const rank = i + 1;
    const rc = rank <= 3 ? `rank-${rank}` : '';
    const content = idea.files['idea.md'] || '';
    const title = extractTitle(content) || idea.slug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    const pitch = extractPitch(content) || '';
    const scores = extractScores(content);

    html += `
      <div class="idea-card" onclick="openModal('${date}',${i})">
        <div class="idea-rank ${rc}">#${rank}</div>
        <h3>${esc(title)}</h3>
        <div class="pitch">${esc(pitch)}</div>
        <div class="idea-scores">
          ${scores ? Object.entries(scores).map(([k, v]) =>
            `<span class="score-pill ${k === 'Avg' || k === 'Average' ? 'highlight' : ''}">${k}: ${v}</span>`
          ).join('') : ''}
        </div>
      </div>
    `;
  });
  html += '</div>';
  el.innerHTML = html;
}

function openModal(date, idx) {
  const idea = data.dates[date].ideas[idx];
  const files = idea.files;
  const names = Object.keys(files);
  const content = files['idea.md'] || '';
  const title = extractTitle(content) || idea.slug.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());

  document.getElementById('modalTitle').textContent = title;
  document.getElementById('modalSubtitle').textContent = fmtDate(date);

  const tabsEl = document.getElementById('modalTabs');
  tabsEl.innerHTML = '';
  names.forEach((name, i) => {
    const tab = document.createElement('div');
    tab.className = 'modal-tab' + (i === 0 ? ' active' : '');
    tab.textContent = name;
    tab.onclick = () => {
      document.querySelectorAll('.modal-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('modalContent').innerHTML = parseMD(files[name]);
    };
    tabsEl.appendChild(tab);
  });

  document.getElementById('modalContent').innerHTML = parseMD(files[names[0]]);
  document.getElementById('modalOverlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {
  if (e && e.target !== e.currentTarget) return;
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

// ── Helpers ──
function fmtDate(s) {
  const d = new Date(s + 'T00:00:00');
  return d.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
}

function extractTitle(md) {
  const m = md.match(/^#\s+(.+)$/m);
  return m ? m[1].replace(/\*\*/g, '').trim() : null;
}

function extractPitch(md) {
  const m = md.match(/##\s+Pitch\s*\n+([\s\S]+?)(?=\n##|\n---)/);
  return m ? m[1].replace(/\*\*/g, '').replace(/\n+/g, ' ').trim() : null;
}

function extractScores(md) {
  // Match the scoring table - handles | Avg |, | Average |, | **Average** |, etc.
  const m = md.match(/\| Dimension.*\|.*(?:Avg|Average|\*\*Average\*\*).*\|([\s\S]+?)(?=\n##|\n---)/);
  if (!m) return null;
  const rows = m[0].split('\n').filter(r => r.includes('|') && !r.includes('Dimension') && !r.includes('---'));
  const scores = {};
  rows.forEach(row => {
    const cells = row.split('|').map(c => c.trim()).filter(c => c);
    if (cells.length >= 2) {
      const val = cells[1].replace(/\*/g, '').trim();
      if (val.match(/[\d.]+/)) scores[cells[0].replace(/\*/g, '').trim()] = val;
    }
  });
  return Object.keys(scores).length ? scores : null;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}


// ── View Switching ──
function switchView(view) {
  document.querySelectorAll('.lb-nav-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.view-section').forEach(s => s.classList.remove('active'));
  if (view === 'daily') {
    document.getElementById('navBtnDaily').classList.add('active');
    document.getElementById('view-daily').classList.add('active');
  } else {
    document.getElementById('navBtnLeaderboard').classList.add('active');
    document.getElementById('view-leaderboard').classList.add('active');
    if (data) renderLeaderboard();
  }
}

// ── Leaderboard State ──
let lbSortBy = 'score'; // 'score' | 'trend' | 'gap' | 'build' | 'evergreen' | 'money' | 'date'
let lbSortDir = 'desc';

function sortLeaderboard(by) {
  if (lbSortBy === by) {
    lbSortDir = lbSortDir === 'desc' ? 'asc' : 'desc';
  } else {
    lbSortBy = by;
    lbSortDir = 'desc';
  }
  renderLeaderboard();
}

function renderLeaderboard() {
  if (!data) return;
  const lb = document.getElementById('view-leaderboard');
  
  // Build leaderboard from data
  let entries = [];
  for (const date of Object.keys(data.dates).sort()) {
    const day = data.dates[date];
    for (const idea of (day.ideas || [])) {
      const md = idea.files['idea.md'] || '';
      const title = extractTitle(md) || idea.slug;
      const scores = extractScores(md) || {};
      const avgStr = (scores['Average'] || scores['Avg'] || '0');
      const avg = parseFloat(avgStr) || 0;
      
      entries.push({
        name: title,
        slug: idea.slug,
        date: date,
        score: avg,
        trend: parseFloat(scores['Trend Momentum'] || '0'),
        gap: parseFloat(scores['App Gap'] || '0'),
        build: parseFloat(scores['Build Simplicity'] || '0'),
        evergreen: parseFloat(scores['Evergreen Potential'] || '0'),
        money: parseFloat(scores['Monetization'] || '0'),
      });
    }
  }
  
  // Sort
  entries.sort((a, b) => {
    let va, vb;
    if (lbSortBy === 'score') { va = a.score; vb = b.score; }
    else if (lbSortBy === 'date') { va = a.date; vb = b.date; }
    else { va = a[lbSortBy]; vb = b[lbSortBy]; }
    if (va === vb) return a.name.localeCompare(b.name);
    return lbSortDir === 'desc' ? vb - va : va - vb;
  });
  
  // Render
  const maxScore = Math.max(...entries.map(e => e.score), 1);
  
  let sortLabel = {score:'Overall', trend:'Trend', gap:'App Gap', build:'Build', evergreen:'Evergreen', money:'Monetization', date:'Date'};
  let dirArrow = lbSortDir === 'desc' ? '↓' : '↑';
  
  let html = `
    <div class="lb-header">
      <h1>🏆 All-Time Leaderboard</h1>
      <div class="lb-subtitle">${entries.length} app ideas ranked by score. Click column headers to sort.</div>
    </div>
    
    <div class="lb-sort">
      <span class="lb-sort-label">Sort by</span>
      ${['score','trend','gap','build','evergreen','money','date'].map(k =>
        `<button class="lb-sort-btn ${lbSortBy === k ? 'active' : ''}" onclick="sortLeaderboard('${k}')">${sortLabel[k]}${lbSortBy === k ? ' ' + dirArrow : ''}</button>`
      ).join('')}
    </div>
    
    <table class="lb-table">
      <thead>
        <tr>
          <th style="width:48px">#</th>
          <th>Idea</th>
          <th class="hide-mobile" style="width:100px">Date</th>
          <th class="right" style="width:90px">Score</th>
          <th class="hide-mobile" style="width:200px">Score Breakdown</th>
          <th class="right hide-mobile" style="width:90px">Bar</th>
        </tr>
      </thead>
      <tbody>
  `;
  
  entries.forEach((e, i) => {
    const rank = i + 1;
    const rankClass = rank <= 3 ? 'r' + rank : 'rn';
    const dateStr = fmtDate(e.date);
    const barWidth = Math.round((e.score / 10) * 100);
    
    // Top dimensions
    const dims = [
      {k:'Tr', v:e.trend}, {k:'Gap', v:e.gap}, {k:'Bld', v:e.build}, {k:'Evr', v:e.evergreen}, {k:'$', v:e.money}
    ];
    const topDims = dims.filter(d => d.v >= 8).slice(0, 3);
    
    html += `
      <tr onclick="openIdeaBySlug('${e.slug}','${e.date}')">
        <td><span class="lb-rank ${rankClass}">${rank}</span></td>
        <td>
          <div class="lb-idea-name">${esc(e.name)}</div>
        </td>
        <td class="hide-mobile"><span class="lb-date">${dateStr}</span></td>
        <td class="right"><span class="lb-score">${e.score.toFixed(1)}</span></td>
        <td class="hide-mobile">
          <div class="lb-dim-pills">
            ${topDims.map(d => `<span class="lb-dim-pill top">${d.k}:${d.v}</span>`).join('')}
          </div>
        </td>
        <td class="right hide-mobile">
          <div class="lb-score-bar-wrap">
            <div class="lb-score-bar">
              <div class="lb-score-bar-fill" style="width:${barWidth}%"></div>
            </div>
          </div>
        </td>
      </tr>
    `;
  });
  
  html += '</tbody></table>';
  lb.innerHTML = html;
}

function openIdeaBySlug(slug, date) {
  switchView('daily');
  // Find the idea index within the date
  const day = data.dates[date];
  if (!day) return;
  const idx = day.ideas.findIndex(i => i.slug === slug);
  if (idx >= 0) {
    selectDate(date);
    setTimeout(() => openModal(date, idx), 50);
  }
}


// ── Go ──
init();
</script>
</body>
</html>
